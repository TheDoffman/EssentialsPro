name: EssentialsPro
version: 1.4
main: org.hoffmantv.essentialspro.EssentialsPro
author: HoffmanTV
description: A Minecraft Essentials plugin.
api-version: 1.20

commands:
  firework:
    description: Launches a firework at the player's location.
    usage: /<command>
    permission: essentialspro.firework
    permission-message: "✖ You do not have permission to use this command."
  workbench:
    description: "Opens a crafting table interface anywhere."
    usage: /workbench
    permission: essentialspro.workbench
    permission-message: "✖ You don't have permission to use this command."
  mute:
    description: Mute or unmute a player.
    usage: /mute <player> [duration]
    permission: essentialspro.mute
    permission-message: "✖ You do not have permission to use this command."
  unmute:
    description: Unmute a player.
    usage: /unmute <player>
    permission: essentialspro.unmute
    permission-message: "✖ You do not have permission to use this command."
  kick:
    description: Kick a player from the server.
    usage: /kick <player> [reason]
    permission: essentialspro.kick  # Permission node for the kick command
    permission-message: "✖ You do not have permission to use this command."
  back:
    description: Teleport to your previous location.
    usage: /back [steps]
    permission: essentialspro.back
    permission-message: "✖ You do not have permission to use this command."
  spawnall:
    description: Teleport all players to spawn.
    usage: /spawnall
    permission: essentialspro.spawnall
    permission-message: "✖ You do not have permission to use this command."
  broadcast:
    description: Broadcast a message to the entire server.
    usage: /broadcast <message>
    permission: essentialspro.broadcast
    permission-message: "✖ You do not have permission to use this command."
  help:
    description: Show the list of available commands.
    usage: /<command> [page]
    permission-message: "✖ You do not have permission to use this command."
  spawn:
    description: Teleport to the server spawn point.
    usage: /spawn
    permission: essentialspro.spawn  # Permission node for the spawn command
    permission-message: "✖ You do not have permission to use this command."
  setspawn:
    description: Set the server spawn point.
    usage: /setspawn
    permission: essentialspro.setspawn
    permission-message: "✖ You do not have permission to use this command."
  sethome:
    description: Set a home location.
    usage: /sethome [name]
    permission: essentialspro.sethome
    permission-message: "✖ You do not have permission to use this command."
  home:
    description: Teleport to a home location.
    usage: /home [name]
    permission: essentialspro.home
    permission-message: "✖ You do not have permission to use this command."
  homes:
    description: List your homes.
    usage: /homes
    permission: essentialspro.homes
    permission-message: "✖ You do not have permission to use this command."
  delhome:
    description: Delete a home location.
    usage: /delhome <name>
    permission: essentialspro.delhome
    permission-message: "✖ You do not have permission to use this command."
  renamehome:
    description: Rename a home location.
    usage: /renamehome <old> <new>
    permission: essentialspro.renamehome
    permission-message: "✖ You do not have permission to use this command."
  gamemode:
    description: Change your game mode.
    usage: /gamemode <1|2|3|4>
    permission: essentialspro.gamemode
    aliases: [ gm ]
    permission-message: "✖ You do not have permission to use this command."
  time:
    description: Change the time of day in the game world.
    usage: /<command> <day|night|morning|evening>
    permission: essentialspro.time   # Add the permission node here
    permission-message: "✖ You do not have permission to use this command."
  weather:
    description: Change the weather in the game world.
    usage: /<command> <clear|rain|storm>
    permission: essentialspro.weather   # Add the permission node here
    permission-message: "✖ You do not have permission to use this command."
  fly:
    description: Toggles flight mode for the player or others.
    usage: /<command> [player]
    permission: essentialspro.fly
    permission-message: "✖ You do not have permission to use this command."
  hat:
    description: Wear the item in your hand as a hat.
    usage: /hat
    permission: essentialspro.hat
    permission-message: "✖ You do not have permission to use this command."
  enderchest:
    description: Open your ender chest.
    usage: /enderchest
    permission: essentialspro.enderchest
    permission-message: "✖ You do not have permission to use this command."
  heal:
    description: Heal yourself or another player.
    usage: /<command> [player]
    permission: essentialspro.heal
    permission-message: "✖ You do not have permission to use this command."
  feed:
    description: Feed yourself or another player.
    usage: /<command> [player]
    permission: essentialspro.feed
    permission-message: "✖ You do not have permission to use this command."
  tp:
    description: Teleport to another player.
    usage: /<command> <player>
    permission: essentialspro.teleport
    permission-message: "✖ You do not have permission to use this command."
  tpall:
    description: Teleport all players to you.
    usage: /tpall
    permission: essentialspro.tpall
    permission-message: "✖ You do not have permission to use this command."
  tpaall:
    description: Send a teleport request to all players.
    usage: /tpaall
    permission: essentialspro.tpaall
    permission-message: "✖ You do not have permission to use this command."
  tphere:
    description: Teleport a player to your location.
    usage: /tphere <player>
    permission: essentialspro.tphere
    permission-message: "✖ You do not have permission to use this command."
  warp:
    description: Teleport to a warp.
    usage: /warp <name>
    permission: essentialspro.warp
    permission-message: "✖ You do not have permission to use this command."
  setwarp:
    description: Set a warp.
    usage: /setwarp <name>
    permission: essentialspro.setwarp
    permission-message: "✖ You do not have permission to use this command."
  warps:
    description: List available warps.
    usage: /warps
    permission: essentialspro.warps
    permission-message: "✖ You do not have permission to use this command."
  listplayers:
    description: Show a list of online players.
    usage: /<command>
    permission: essentialspro.listplayers
    aliases: [ lp, list ]
    permission-message: "✖ You do not have permission to use this command."
  motd:
    description: Change the MOTD of the server
    usage: /motd <message>
    permission: essentialspro.motd
    permission-message: "✖ You do not have permission to use this command."
  seen:
    description: View a player's last seen time.
    usage: /seen <player>
    permission: essentialspro.seen
    permission-message: "✖ You do not have permission to use this command."
  warn:
    description: Warn a player.
    usage: /warn <player> <reason>
    permission: essentialspro.warn
    permission-message: "✖ You do not have permission to use this command."
  warnings:
    description: View player warnings.
    usage: /warnings [player]
    permission: essentialspro.warnings
    permission-message: "✖ You do not have permission to use this command."
  clearwarnings:
    description: Clear player warnings.
    usage: /clearwarnings <player>
    permission: essentialspro.clearwarnings
    permission-message: "✖ You do not have permission to use this command."
  vanish:
    description: Toggle vanish mode.
    usage: /vanish
    permission: essentialspro.vanish
    permission-message: "✖ You do not have permission to use this command."
  reloadessentials:
    description: Reload the EssentialsPro configuration
    usage: /reloadessentials
    permission: essentialspro.reload
    aliases: [ epr ]
    permission-message: "✖ You do not have permission to use this command."
  smite:
    description: Smite a player with lightning
    usage: /smite <player>
    permission: essentialspro.smite
    permission-message: "✖ You do not have permission to use this command."
  clearchat:
    description: Clears the chat for all players.
    usage: /clearchat
    permission: essentialspro.clearchat
    permission-message: "✖ You do not have permission to use this command."
  inventorysee:
    description: Allows a player to see into another player's inventory.
    usage: /inventorysee <player>
    permission: essentialspro.inventorysee
    permission-message: "✖ You do not have permission to use this command."
  message:
    description: Send a private message to another player.
    usage: /message <player> <message>
    permission: essentialspro.message
    permission-message: "✖ You do not have permission to use this command."
  ban:
    description: Bans a player from the server.
    usage: /<command> <player> <reason> [duration]
    permission: essentialspro.ban
    permission-message: "✖ You do not have permission to use this command."
  unban:
    description: Unban a player.
    usage: /unban <player>
    permission: essentialspro.unban
    permission-message: "✖ You do not have permission to use this command."
  freeze:
    description: Freezes or unfreezes a player.
    usage: /freeze <player>
    permission: essentialspro.freeze
    permission-message: "✖ You do not have permission to use this command."

  repair:
    description: Allows a player to fix the item in their hand.
    usage: /repair
    permission: essentialspro.repair
    permission-message: "✖ You do not have permission to use this command."
  tpa:
    description: Send a teleport request to a specific player.
    usage: /tpa [name]
    permission: essentialspro.tpa
    permission-message: "✖ You do not have permission to use this command."
  tpaccept:
    description: Allows a player to accept a teleport request.
    usage: /tpaccept
    permission: essentialspro.tpaccept
    permission-message: "✖ You do not have permission to use this command."
  tpdeny:
    description: Allows a player to deny a teleport request.
    usage: /tpdeny
    permission: essentialspro.tpdeny
    permission-message: "✖ You do not have permission to use this command."
  clearinventory:
    description: Clears a player's inventory.
    usage: /clearinventory [player]
    permission: essentialspro.clearinventory
    aliases: [ ci ]
    permission-message: "✖ You do not have permission to use this command."
  jail:
    description: Jails a player, preventing them from moving, breaking blocks, or dropping items.
    usage: /jail <player>
    permission: essentialspro.jail
    permission-message: "✖ You do not have permission to use this command."
  unjail:
    description: Unjails a player.
    usage: /unjail <player>
    permission: essentialspro.unjail
    permission-message: "✖ You do not have permission to use this command."
  shadowmode:
    description: Toggle Shadow Mode for invisibility and non-interaction.
    usage: /shadowmode
    permission: essentialspro.shadowmode
    permission-message: "✖ You do not have permission to use this command."
  freezetime:
    description: Allows a player to freeze the time cycle of the server.
    usage: /freezetime [global|player <player>] [duration]
    permission: essentialspro.freezetime
    permission-message: "✖ You do not have permission to use this command."
  spawnmob:
    description: Spawns a mob of the specified type.
    usage: /spawnmob <mob_type> [amount]
    permission: essentialspro.spawnmob
    permission-message: "✖ You do not have permission to use this command."
  rtp:
    description: Teleport to a random location.
    usage: /rtp
    permission: essentialspro.rtp
    permission-message: "✖ You do not have permission to use this command."
  afk:
    description: Put a player into afk.
    usage: /afk
    permission: essentialspro.afk
    permission-message: "✖ You do not have permission to use this command."
permissions:
  essentialspro.*:
    description: Gives access to all EssentialsPro commands.
    children:
      essentialspro.kick: true
      essentialspro.back: true
      essentialspro.spawnall: true
      essentialspro.broadcast: true
      essentialspro.spawn: true
      essentialspro.setspawn: true
      essentialspro.sethome: true
      essentialspro.home: true
      essentialspro.homes: true
      essentialspro.delhome: true
      essentialspro.renamehome: true
      essentialspro.gamemode: true
      essentialspro.time: true
      essentialspro.weather: true
      essentialspro.fly: true
      essentialspro.hat: true
      essentialspro.enderchest: true
      essentialspro.fly.others: true
      essentialspro.heal: true
      essentialspro.heal.others: true
      essentialspro.feed: true
      essentialspro.feed.others: true
      essentialspro.teleport: true
      essentialspro.tpall: true
      essentialspro.tpaall: true
      essentialspro.tphere: true
      essentialspro.warp: true
      essentialspro.setwarp: true
      essentialspro.warps: true
      essentialspro.listplayers: true
      essentialspro.nickname: true
      essentialspro.motd: true
      essentialspro.seen: true
      essentialspro.warn: true
      essentialspro.warnings: true
      essentialspro.warnings.others: true
      essentialspro.clearwarnings: true
      essentialspro.vanish: true
      essentialspro.reload: true
      essentialspro.smite: true
      essentialspro.clearchat: true
      essentialspro.inventorysee: true
      essentialspro.message: true
      essentialspro.ban: true
      essentialspro.unban: true
      essentialspro.freeze: true
      essentialspro.freeze.others: true
      essentialspro.magiccarpet: true
      essentialspro.firework: true
      essentialspro.repair: true
      essentialspro.tpdeny: true
      essentialspro.tpaccept: true
      essentialspro.tpa: true
      essentialspro.mute: true
      essentialspro.unmute: true
      essentialspro.unjail: true
      essentialspro.jail: true
      essentialspro.shadowmode: true
      essentialspro.freezetime: true
      essentialspro.afk: true
      essentialspro.signcolor: true
      essentialspro.rtp: true
